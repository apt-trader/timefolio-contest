##############################################
# TimeFolio Risk Alert Configuration
##############################################

# Maximum Drawdown Thresholds
mdd:
  threshold_6m: 0.15  # 15% drawdown over 6 months
  threshold_12m: 0.25  # 25% drawdown over 12 months
  alert_level: WARNING

# Portfolio Concentration (Herfindahl-Hirschman Index)
hhi:
  # Weight concentration
  weight_threshold: 0.20  # HHI > 0.20 indicates high concentration
  # Return contribution concentration
  return_threshold: 0.30  # HHI > 0.30 for return contribution indicates excessive dependency
  alert_level: WARNING

# Turnover
turnover:
  min_threshold: 0.05  # Too little turnover (<5%) may indicate model stagnation
  max_threshold: 0.50  # Too much turnover (>50%) indicates excessive trading
  alert_level: WARNING

# Tracking Error
tracking_error:
  threshold: 0.08  # Tracking error vs benchmark > 8% triggers alert
  alert_level: WARNING

# Alert Delivery Methods
notify:
  slack: true
  email: true
  log_file: true
