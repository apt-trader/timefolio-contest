# config/config.yaml

# ===================================================================
#                    TimeFolio System Configuration
# ===================================================================
# This file centralizes all strategic and technical parameters for
# the portfolio construction and backtesting process.
# ===================================================================

# --- Data and Date Settings ---
data_settings:
  # Paths are relative to the project root (timefolio-2025-main/)
  stock_universe_file: "sector_universe.csv"
  market_sectors_file: "market_sectors.csv"
  db_path: "krx_data.db"
  
  # Global date range for backtesting and analysis.
  # It is recommended to use at least 3-4 years of data.
  start_date: '2020-01-01'
  end_date: '2025-06-30'

# --- Portfolio Optimization Parameters ---
optimization:
  max_positions: 12           # Cardinality constraint (max number of stocks)
  individual_limit: 0.15      # Max weight for any single stock
  min_weight: 0.01            # Min weight for any single stock
  risk_aversion: 1.25         # Tunable: How much to penalize risk. Higher = more conservative portfolio.
  l2_penalty: 0.2             # Tunable: Regularization to prevent overfitting and encourage diversification.

# --- Pre-Optimization Data Filters (Compliance Rules) ---
risk_management:
  min_avg_daily_value: 3000000000      # Min avg 20-day trading value (in KRW) to ensure liquidity.
  min_ipo_days: 90                     # Stock must be listed for at least 90 days.
  small_cap_threshold: 1000000000000   # 1 Trillion KRW. Stocks below this are 'small-cap'.
  max_small_cap_weight: 0.40           # Max total portfolio weight allocated to small-cap stocks.

# --- Alpha Factor Calculation Settings ---
factor_engine:
  # Lookback windows (in trading days) for momentum calculations.
  mom_windows: [20, 60, 120]           # Tunable
  # Lookback window for volatility calculations.
  vol_window: 25                       # Tunable